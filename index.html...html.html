<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5EF">
<title>TOEIC 1000 Vocabulary</title>
<style>
:root{
  --bg:#F7F5EF; --sage:#A8B5A0; --sage-d:#6B7C63; --mist:#B8C5CC; --mist-d:#5F7480;
  --card:#E9E1D4; --text:#555650; --muted:#6F7068; --ink:#3A3B36;
  --ok:#D3DCCB; --bad:#EAD8D2; --bad-d:#9A6B5F; --line:#D9D1C1; --white:#FBFAF6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.7;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.3;color:var(--ink);font-weight:700}
h2{font-size:22px;line-height:1.4;color:var(--ink);font-weight:700}
.sub{color:var(--muted);font-size:17px}
.sp{height:14px}.sp2{height:24px}
.card{background:var(--card);border-radius:24px;padding:22px 20px}
.card+.card{margin-top:16px}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 20px;border-radius:18px;background:var(--sage);color:var(--ink);font-size:19px;font-weight:600;width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--mist)}
.btn.ghost{background:transparent;border:2px solid var(--sage);color:var(--sage-d)}
.btn.soft{background:var(--white);border:1.5px solid var(--line)}
.btn.sm{min-height:50px;font-size:18px;padding:8px 14px;border-radius:15px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--sage-d);color:#fff}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stack>*+*{margin-top:12px}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.f svg{fill:currentColor}
.ib{width:52px;height:52px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sage-d)}
.ib.star.on{color:#B5873A;background:#F1E7CF}
.ib.star.on svg{fill:currentColor}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:6px 16px;border-radius:23px;background:var(--white);border:1.5px solid var(--line);font-size:18px;font-weight:500;color:var(--text)}
.chip.on{background:var(--sage);border-color:var(--sage);color:var(--ink);font-weight:700}
.lbl{font-size:16px;color:var(--muted);margin:16px 0 8px;font-weight:600;letter-spacing:.5px}
.seg{display:flex;background:var(--card);border-radius:18px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:14px;font-size:18px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.top h2{white-space:nowrap}
.rates{display:flex;gap:6px}
.rates button{min-width:56px;min-height:44px;border-radius:14px;background:var(--white);border:1.5px solid var(--line);font-size:17px;font-weight:600}
.rates button.on{background:var(--mist);border-color:var(--mist);color:var(--ink)}
.rates-lbl{font-size:16px;color:var(--muted);margin-right:2px;white-space:nowrap;align-self:center}

/* progress */
.bar{height:12px;border-radius:6px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage-d);border-radius:6px;transition:width .3s}
.prog{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:18px;color:var(--muted)}
.prog b{color:var(--ink);font-size:20px}

/* word card */
.word{font-size:clamp(36px,11vw,44px);font-weight:700;color:var(--ink);text-align:center;line-height:1.2;word-break:break-word;margin:14px 0 18px;letter-spacing:-.3px}
.wcard-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.layer{margin-top:18px;padding-top:18px;border-top:1.5px dashed #CBC1AE}
.layer .t{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.sense{font-size:22px;line-height:1.55;color:var(--ink);font-weight:600}
.sense .pos,.pos{display:inline-block;font-size:16px;font-weight:700;background:var(--mist);color:#3F5560;border-radius:10px;padding:0 10px;margin-right:8px;line-height:1.6;vertical-align:2px}
.en-ex{font-size:19px;line-height:1.7;color:var(--ink);font-weight:500}
.zh-ex{font-size:19px;line-height:1.7;color:var(--muted)}
.hidden-ph{font-size:18px;color:#9A9A8E;padding:6px 0}
.tgl{margin-top:10px}
.exrow{display:flex;gap:10px;align-items:flex-start}
.exrow .ib{width:48px;height:48px;margin-top:2px}

/* home */
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.ring .n b{font-size:30px;color:var(--ink)}.ring .n span{font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{background:var(--white);border-radius:18px;padding:14px 8px;text-align:center;border:1.5px solid var(--line)}
.stat b{display:block;font-size:30px;color:var(--ink);line-height:1.2}
.stat span{font-size:16px;color:var(--muted)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat button{background:var(--card);border-radius:22px;padding:20px 12px;text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.feat button:active{transform:scale(.97)}
.feat .ic{color:var(--sage-d)}.feat .ic svg{width:38px;height:38px}
.feat b{font-size:21px;color:var(--ink)}.feat span{font-size:15px;color:var(--muted);line-height:1.4}
.week{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:14px;color:var(--muted)}
.week i{display:block;width:100%;background:var(--sage);border-radius:6px 6px 0 0;min-height:4px}
.week em{font-style:normal;font-size:14px;color:var(--ink);font-weight:700}

/* list rows */
.item{background:var(--card);border-radius:20px;padding:14px 14px 14px 16px}
.item+.item{margin-top:10px}
.item .head{display:flex;gap:10px;align-items:center}
.item .info{flex:1;min-width:0}
.item .w{font-size:26px;font-weight:700;color:var(--ink);line-height:1.25;word-break:break-word}
.item .m{font-size:18px;color:var(--text);line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:15px;border-radius:10px;padding:0 9px;background:var(--white);color:var(--muted);line-height:1.6}
.tag.ok{background:var(--ok);color:var(--sage-d)}.tag.bad{background:var(--bad);color:var(--bad-d)}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1.5px dashed #CBC1AE}
.item.open .detail{display:block}
.item .chev svg{transition:transform .2s}.item.open .chev svg{transform:rotate(180deg)}
.search{width:100%;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--white);padding:10px 18px;font-size:19px;color:var(--ink);outline:none}
.search:focus{border-color:var(--sage-d)}
select.search{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;background-size:6px 6px;background-repeat:no-repeat}

/* quiz */
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;background:var(--white);border:2px solid var(--line);text-align:left;font-size:21px;font-weight:600;color:var(--ink);line-height:1.4}
.opt+.opt{margin-top:10px}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted)}
.opt.en{font-size:26px}
.opt.right{background:var(--ok);border-color:var(--sage-d)}
.opt.wrong{background:var(--bad);border-color:var(--bad-d)}
.opt.dim{opacity:.55}
.qtxt{font-size:16px;color:var(--muted);text-align:center;font-weight:600}
.fb{border-radius:20px;padding:16px 18px;margin-top:14px}
.fb.ok{background:var(--ok)}.fb.no{background:var(--bad)}
.fb h3{font-size:22px;color:var(--ink)}
.score{font-size:60px;font-weight:700;color:var(--ink);line-height:1.2}

/* voice */
.apstep{padding:10px 14px;border-radius:16px;margin-top:8px;opacity:1;transition:all .2s;border:2px solid transparent}
.ap-on .apstep{opacity:.45}.ap-on .apstep.cur{opacity:1}.apstep.cur{background:var(--white);border-color:var(--sage)}
.ap-on .apstep.done{opacity:.75}
.big-play{width:116px;height:116px;border-radius:50%;background:var(--sage);color:var(--ink);display:flex;align-items:center;justify-content:center;margin:10px auto}
.big-play svg{width:52px;height:52px;fill:currentColor;stroke:none}
.big-play:active{transform:scale(.95)}
.said{margin-top:12px;font-size:20px;line-height:1.8}
.said .y{background:var(--ok);border-radius:8px;padding:0 6px;margin:0 2px}
.said .n{background:var(--bad);border-radius:8px;padding:0 6px;margin:0 2px}

.note{background:#EFE9DA;border-radius:16px;padding:12px 16px;font-size:17px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,245,239,.97);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20;backdrop-filter:blur(8px)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 2px 8px;min-height:68px;color:#8A8B80;font-size:15px;font-weight:600}
nav button.on{color:var(--sage-d)}
nav button .ic svg{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:17px;z-index:50;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mt{margin-top:14px}.mt2{margin-top:22px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav aria-label="主要導覽"><div class="in" id="nav"></div></nav>

/* ====== 語音（Web Speech API） ====== */
const TTS={ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),en:null,zh:null,n:0};
function pickVoices(){
  if(!TTS.ok)return;
  let v=[];try{v=speechSynthesis.getVoices()||[]}catch(e){}
  TTS.n=v.length;
  const L=x=>(x.lang||'').replace('_','-').toLowerCase();
  const prefEn=['samantha','aria','jenny','ava','allison','google us english','nicky','zira','alex'];
  const us=v.filter(x=>L(x)==='en-us');
  let en=null;
  for(const p of prefEn){en=us.find(x=>x.name.toLowerCase().includes(p));if(en)break}
  en=en||us[0]||v.find(x=>L(x).startsWith('en'))||null;
  let zh=v.find(x=>L(x)==='zh-tw'||L(x)==='zh-hant-tw')||v.find(x=>L(x)==='zh-hk')||v.find(x=>L(x).startsWith('zh'))||null;
  if(zh){const tw=v.filter(x=>L(x)==='zh-tw');const pf=tw.find(x=>/meijia|mei-jia|hanhan|google|yating/i.test(x.name));if(pf)zh=pf}
  TTS.en=en;TTS.zh=zh;
}
if(TTS.ok){pickVoices();try{speechSynthesis.addEventListener('voiceschanged',()=>{pickVoices();softRefreshVoiceInfo()})}catch(e){speechSynthesis.onvoiceschanged=pickVoices}}
function softRefreshVoiceInfo(){const el=$('#voiceInfo');if(el)el.innerHTML=voiceInfoHTML()}
let warned={};
function speak(text,lang){
  return new Promise(res=>{
    if(!TTS.ok||!text){res(false);return}
    try{
      if(!TTS.n)pickVoices();
      const u=new SpeechSynthesisUtterance(text);
      const isZh=lang==='zh';
      const v=isZh?TTS.zh:TTS.en;
      u.lang=isZh?'zh-TW':'en-US';
      if(v){u.voice=v;u.lang=v.lang}
      else if(TTS.n&&!warned[lang]){warned[lang]=1;toast(isZh?'找不到繁體中文語音，將使用裝置預設語音':'找不到英文語音，將使用裝置預設語音')}
      u.rate=S.set.rate;
      let done=false;
      const fin=ok=>{if(done)return;done=true;clearTimeout(t);res(ok)};
      const t=setTimeout(()=>fin(false),4000+text.length*260/S.set.rate);
      u.onend=()=>fin(true);u.onerror=()=>fin(false);
      if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){res(false)}
  });
}
function stopSpeech(){try{if(TTS.ok)speechSynthesis.cancel()}catch(e){}}
function say(id,what){
  const w=byId(id);
  if(!TTS.ok){toast('此瀏覽器不支援語音朗讀，請改用 Safari 或 Chrome');return}
  stopSpeech();
  if(what==='word')speak(w.w,'en');else if(what==='ex')speak(w.e,'en');else if(what==='zh')speak(zhSpeech(w),'zh');
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){
  const o=$('.toast');if(o)o.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function voiceHint(){
  if(!TTS.ok)return '<div class="note">這個瀏覽器不支援語音朗讀，請改用手機的 Safari 或 Chrome 開啟，其餘功能仍可正常使用。</div>';
  if(TTS.n&&!TTS.en)return '<div class="note">找不到英文語音，將使用裝置預設語音。可到手機的「系統設定 → 語音內容」下載美式英文語音。</div>';
  return '';
}
function voiceInfoHTML(){
  if(!TTS.ok)return '不支援語音朗讀';
  return '英文語音：'+(TTS.en?esc(TTS.en.name)+'（'+esc(TTS.en.lang)+'）':'未偵測到（使用預設）')+'<br>中文語音：'+(TTS.zh?esc(TTS.zh.name)+'（'+esc(TTS.zh.lang)+'）':'未偵測到（使用預設）');

const SRC=[['today','今日單字'],['learned','已學習'],['fav','我的收藏'],['wrong','我的錯題'],['all','全部單字']];
function ensureSession(force){
  const b=S.set.batch,ss=S.session;
  const allDone=ss&&ss.ids.every(id=>S.learned[id]);
  if(force||!ss||ss.batch!==b||allDone||!ss.ids.length){
    const ids=[];for(let i=1;i<=N&&ids.length<b;i++)if(!S.learned[i])ids.push(i);
    S.session={ids,idx:0,batch:b,date:today()};save();
  }
  return S.session;
}
function getPool(src,forLearn){
  switch(src){
    case 'today':{
      if(forLearn)return ensureSession().ids.slice();
      /* 測驗與語音：用「今天已學過」的單字，沒有的話才用目前這一組 */
      const t=today(),ids=Object.keys(S.learned).filter(k=>S.learned[k]===t).map(Number).sort((a,b)=>a-b);
      return ids.length?ids:ensureSession().ids.slice()}
    case 'learned':return Object.keys(S.learned).map(Number).sort((a,b)=>a-b);
    case 'fav':return Object.keys(S.fav).map(Number).sort((a,b)=>a-b);
    case 'wrong':return Object.keys(S.wrong).map(Number).filter(i=>!S.wrong[i].fam).sort((a,b)=>a-b);
    default:return D.map(x=>x.id);
  }
}

/* ====== 語音：自動播放 ====== */
function apPrepare(){
  AP.ids=getPool(S.ui.src);
  AP.i=0;AP.step=0;AP.st='idle';
}
function apText(w,step){
  return step===0?[w.w,'en']:step===1?[zhSpeech(w),'zh']:step===2?[w.e,'en']:[w.z,'zh'];
}
async function apRun(){
  const my=++AP.tok;AP.st='playing';lockOn();touchDay();save();render();
  if(!TTS.ok){AP.st='idle';render();toast('此瀏覽器不支援語音朗讀');return}
  while(my===AP.tok){
    while(AP.i<AP.ids.length){
      const w=byId(AP.ids[AP.i]);
      for(;AP.step<4;AP.step++){
        if(my!==AP.tok)return;
        updateAP();
        const [t,l]=apText(w,AP.step);
        await speak(t,l);
        if(my!==AP.tok)return;
        await sleep(1000);
        if(my!==AP.tok)return;
      }
      AP.step=0;AP.i++;
      if(my!==AP.tok)return;
      if(AP.i<AP.ids.length)render();
    }
    if(S.ui.loop&&my===AP.tok){AP.i=0;AP.step=0;render();continue}
    break;
  }
  if(my===AP.tok){AP.st='done';AP.i=Math.max(0,AP.ids.length-1);AP.step=0;lockOff();render()}
}
function apStop(silent){AP.tok++;stopSpeech();lockOff();if(AP.st!=='idle'){AP.st='idle';AP.i=0;AP.step=0}if(!silent)render()}
function apPause(){AP.tok++;stopSpeech();AP.st='paused';lockOff();render()}
function apJump(d){
  const was=AP.st==='playing';
  AP.tok++;stopSpeech();
  const ni=AP.i+d;if(ni<0||ni>=AP.ids.length){toast(ni<0?'已經是第一個':'已經是最後一個');if(was)apRun();return}
  AP.i=ni;AP.step=0;
  if(was)apRun();else{if(AP.st==='done')AP.st='paused';render()}
}

function shPrepare(){SH.ids=getPool(S.ui.src);SH.i=0;SH.res=null;SH.src=S.ui.src;SH.rec=false}
function norm(t){return t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean)}
function vShadow(){
  if(SH.src!==S.ui.src)shPrepare();

    else res='<div class="said"><div class="sub">你說的：'+esc(SH.res.text||'（沒有聽到）')+'</div><div class="mt">'+SH.res.tokens.map(t=>'<span class="'+(t[1]?'y':'n')+'">'+esc(t[0])+'</span>').join(' ')+'</div><div class="mt"><b>吻合度 '+SH.res.pct+'%</b>　'+(SH.res.pct>=80?'發音很清楚，很棒！':SH.res.pct>=50?'不錯，再聽一次試試看':'再聽一次、慢一點說說看')+'</div></div>';
  }

  '<div class="card center">'+(SH.target==='word'?'<div class="word" style="margin-bottom:4px">'+esc(w.w)+'</div><div class="sense" style="font-size:20px">'+esc(zhShort(w))+'</div>':'<div class="en-ex" style="font-size:22px">'+esc(w.e)+'</div><div class="zh-ex mt">'+esc(w.z)+'</div>')+
  '<div class="sp"></div><div class="stack"><button class="btn" data-act="sh-listen">'+ico('spk')+'先聽一次</button><button class="btn sec" data-act="sh-rec">'+ico('mic')+(SH.rec?'聆聽中…（再點一次停止）':'開始跟讀')+'</button></div>'+
  (SR?'':'<div class="note mt">這個瀏覽器沒有語音辨識功能，請聽完後自己大聲跟讀；若想要自動比對發音，可改用 Android Chrome 或新版 iOS Safari。</div>')+res+'</div>'+
  '<div class="sp"></div><div class="btns2"><button class="btn soft" data-act="sh-prev" '+(SH.i===0?'disabled':'')+'>'+ico('prev')+'上一個</button><button class="btn soft" data-act="sh-next" '+(SH.i===n-1?'disabled':'')+'>下一個'+ico('next')+'</button></div>';
}
function shRec(){
  if(!SR){toast('此瀏覽器不支援語音辨識，請聽完後自行跟讀');SH.res=null;return}
  if(SH.rec&&srObj){try{srObj.stop()}catch(e){}return}
  stopSpeech();
  const w=byId(SH.ids[SH.i]),target=SH.target==='word'?w.w:w.e;
  try{
    const r=new SR();srObj=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>{
      let best='';
      const alts=e.results[0];
      const tt=norm(target);let bestScore=-1;
      for(let k=0;k<alts.length;k++){const t=alts[k].transcript;const set=new Set(norm(t));const sc=tt.filter(x=>set.has(x)).length;if(sc>bestScore){bestScore=sc;best=t}}
      const set=new Set(norm(best));
      const toks=target.split(/\s+/).map(tok=>[tok,set.has(norm(tok)[0]||'')||norm(tok).length===0]);
      const m=toks.filter(t=>t[1]).length;
      SH.res={text:best,tokens:toks,pct:Math.round(m/toks.length*100)};touchDay();save();
    };
    r.onerror=e=>{SH.res={err:e.error==='not-allowed'||e.error==='service-not-allowed'?'沒有麥克風權限，請在瀏覽器網址列允許使用麥克風。':e.error==='no-speech'?'沒有聽到聲音，請靠近麥克風再試一次。':'語音辨識暫時無法使用，請稍後再試，或聽完後自行跟讀。'}};
    r.onend=()=>{SH.rec=false;if(V.tab==='voice'&&V.voice==='shadow')render()};
    SH.rec=true;SH.res=null;r.start();render();
  }catch(e){SH.rec=false;SH.res={err:'語音辨識無法啟動，請聽完後自行跟讀。'};render()}
}
function shMove(d){const ni=SH.i+d;if(ni<0||ni>=SH.ids.length)return;try{if(srObj)srObj.abort()}catch(e){}SH.rec=false;SH.i=ni;SH.res=null;render()}

/* ====== 測驗 ====== */
const QT=[['en2zh','英文選中文','看到英文單字，選出正確的中文意思'],['zh2en','中文選英文','看到中文解釋，選出正確的英文單字'],['listen','聽力測驗','聽單字發音，選出正確的中文意思']];
function makeQuiz(type,src,n){
  const pool=shuffle(getPool(src)).slice(0,n);
  return pool.map(id=>{
    const w=byId(id),sw=segs(w);
    const prim=w.s[0].p;
    let c=shuffle(D).filter(x=>x.id!==id&&x.w.toLowerCase()!==w.w.toLowerCase()&&![...segs(x)].some(t=>sw.has(t)));
    c=c.filter(x=>x.s[0].p===prim).concat(c.filter(x=>x.s[0].p!==prim));
    const dist=[];
    for(const x of c){if(dist.length>=3)break;const xs=segs(x);if(dist.every(d=>![...segs(d)].some(t=>xs.has(t))))dist.push(x)}
    return {id,opts:shuffle([w,...dist]).map(x=>x.id),pick:null};
  });
}
function startQuiz(){
  const items=makeQuiz(S.ui.qtype,S.ui.src,S.ui.qn);

  Q={type:S.ui.qtype,src:S.ui.src,items,i:0,correct:0,done:false,logged:false};

function qAnswer(oid){

  return '<div class="item'+(V.open.has(id)?' open':'')+'" data-row="'+id+'"><div class="head"><div class="info"><div class="w">'+esc(w.w)+'</div><div class="m">'+esc(zhShort(w))+'</div>'+(tags?'<div class="tags">'+tags+'</div>':'')+'</div>'+
  '<button class="ib" data-act="say" data-id="'+id+'" data-v="word" aria-label="播放單字">'+ico('spk')+'</button><button class="ib chev" data-act="detail" data-id="'+id+'" aria-label="展開">'+ico('chev')+'</button></div>'+
  '<div class="detail"><div class="exrow"><div class="en-ex grow">'+esc(w.e)+'<div class="zh-ex">'+esc(w.z)+'</div></div><button class="ib" data-act="say" data-id="'+id+'" data-v="ex" aria-label="播放例句">'+ico('spk')+'</button></div>'+
  '<div class="btns2 mt"><button class="btn soft sm" data-act="rfav" data-id="'+id+'">'+(S.fav[id]?'取消收藏':'☆ 收藏')+'</button>'+
  (wr?'<button class="btn soft sm" data-act="fam" data-id="'+id+'">'+(wr.fam?'取消熟悉':'標記已熟悉')+'</button>':'<button class="btn soft sm" data-act="rlearn" data-id="'+id+'">'+(S.learned[id]?'取消已學':'標記已學')+'</button>')+'</div></div></div>';
}
function vFav(){
  const ids=getPool('fav');
  return '<div class="lbl" style="margin-top:0">我的收藏（'+ids.length+'）</div>'+(ids.length?'<div class="btns3" style="margin-bottom:14px"><button class="btn sec sm" data-act="mego" data-v="voice" data-src="fav">聆聽</button><button class="btn sec sm" data-act="mego" data-v="learn" data-src="fav">卡片</button><button class="btn sec sm" data-act="mego" data-v="quiz" data-src="fav">測驗</button></div>'+ids.map(i=>rowHTML(i)).join(''):emptyBox('fav'));
}
function vWrong(){
  const all=Object.keys(S.wrong).map(Number).sort((a,b)=>S.wrong[b].n-S.wrong[a].n||a-b),todo=all.filter(i=>!S.wrong[i].fam),fam=all.filter(i=>S.wrong[i].fam);
  return '<div class="lbl" style="margin-top:0">待加強（'+todo.length+'）</div>'+(todo.length?'<div class="btns3" style="margin-bottom:14px"><button class="btn sm" data-act="mego" data-v="quiz" data-src="wrong">重新測驗</button><button class="btn sec sm" data-act="mego" data-v="learn" data-src="wrong">卡片</button><button class="btn sec sm" data-act="mego" data-v="voice" data-src="wrong">聆聽</button></div>'+todo.map(i=>rowHTML(i)).join(''):emptyBox('wrong'))+
  (fam.length?'<div class="lbl mt2">已熟悉（'+fam.length+'）・仍保留紀錄</div>'+fam.map(i=>rowHTML(i)).join(''):'');
}
function libIds(){
  const f=V.lib,q=f.q.trim().toLowerCase();
  return D.filter(w=>{
    if(f.pos!=='all'&&!w.s.some(s=>s.p===f.pos))return false;
    if(f.unit!=='all'&&w.u!==+f.unit)return false;
    if(f.st==='learned'&&!S.learned[w.id])return false;
    if(f.st==='new'&&S.learned[w.id])return false;
    if(f.st==='fav'&&!S.fav[w.id])return false;
    if(f.st==='wrong'&&!S.wrong[w.id])return false;
    if(q&&!(w.w.toLowerCase().includes(q)||w.s.some(s=>s.m.includes(q))||w.z.includes(q)||w.e.toLowerCase().includes(q)))return false;
    return true;
  }).map(w=>w.id);
}
function libListHTML(){
  const ids=libIds(),f=V.lib,show=ids.slice(0,f.n);
  return '<div class="sub" style="margin:10px 2px">找到 '+ids.length+' 個單字</div>'+(show.length?show.map(i=>rowHTML(i)).join(''):'<div class="empty"><b>沒有符合的單字</b>換個關鍵字或條件試試看</div>')+(ids.length>show.length?'<div class="sp"></div><button class="btn soft" data-act="lib-more">顯示更多（還有 '+(ids.length-show.length)+' 個）</button>':'');
}
function vLib(){
  const f=V.lib;
  const unitOpts='<option value="all">全部單元</option>'+Array.from({length:N/100},(_,k)=>'<option value="'+k+'"'+(String(f.unit)===String(k)?' selected':'')+'>單元 '+(k+1)+'（'+(k*100+1)+'–'+(k*100+100)+' 個）</option>').join('');
  return '<input id="libq" class="search" type="search" placeholder="搜尋英文或中文…" value="'+esc(f.q)+'" autocomplete="off" autocapitalize="off">'+
  '<div class="lbl">詞性</div><div class="chips">'+[['all','全部'],['n.','名詞'],['v.','動詞'],['adj.','形容詞'],['adv.','副詞'],['prep.','介系詞']].map(p=>'<button class="chip'+(f.pos===p[0]?' on':'')+'" data-act="lib-pos" data-v="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+
  '<div class="lbl">狀態</div><div class="chips">'+[['all','全部'],['new','未學習'],['learned','已學習'],['fav','收藏'],['wrong','錯題']].map(p=>'<button class="chip'+(f.st===p[0]?' on':'')+'" data-act="lib-st" data-v="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+
  '<div class="lbl">單元</div><select id="libu" class="search">'+unitOpts+'</select><div id="libList">'+libListHTML()+'</div>';
}
function vSet(){
  const lc=learnedCount();
  return '<div class="lbl" style="margin-top:0">預設語速</div><div class="chips">'+[0.75,1,1.25,1.5].map(r=>'<button class="chip'+(S.set.rate===r?' on':'')+'" data-act="rate" data-v="'+r+'">'+r+' 倍</button>').join('')+'</div>'+
  '<div class="lbl">每次學習單字數</div><div class="chips">'+[5,10,20,30].map(n=>'<button class="chip'+(S.set.batch===n?' on':'')+'" data-act="batch" data-v="'+n+'">'+n+' 個</button>').join('')+'</div>'+
  '<div class="lbl">每日學習目標</div><div class="chips">'+[5,10,20,30,50].map(n=>'<button class="chip'+(S.set.goal===n?' on':'')+'" data-act="goal" data-v="'+n+'">'+n+' 個</button>').join('')+'</div>'+
  '<div class="lbl">語音測試</div><div class="card"><div class="stack"><button class="btn sec sm" data-act="vtest-en">'+ico('spk')+'測試英文發音</button><button class="btn sec sm" data-act="vtest-zh">'+ico('spk')+'測試中文發音</button></div><div class="sub mt" id="voiceInfo" style="font-size:16px">'+voiceInfoHTML()+'</div></div>'+
  '<div class="lbl">單字資料</div><div class="card"><div class="sub" style="font-size:17px;line-height:1.8">資料來源：《【刷刷鍋】多益一千單字表》PDF（100 頁）<br>匯入成功：<b>'+N+'</b> 筆（其中 <b>'+D.filter(w=>w.q).length+'</b> 筆原檔拼字待確認）<br>多重詞性單字：<b>'+D.filter(w=>w.s.length>1).length+'</b> 個（全數保留）<br>已學習：<b>'+lc+'</b> 個</div></div>'+
  '<div class="lbl">學習紀錄</div><div class="stack">'+(storeOK?'':'<div class="note">目前無法寫入瀏覽器儲存空間（可能是無痕模式），關閉頁面後紀錄會消失。</div>')+'<button class="btn soft" data-act="export">匯出學習紀錄（備份檔）</button><button class="btn soft" style="color:var(--bad-d)" data-act="reset">清除全部學習紀錄</button></div>';
}
function vMe(){
  const tabs='<div class="seg">'+[['fav','收藏'],['wrong','錯題'],['lib','單字庫'],['set','設定']].map(t=>'<button data-act="metab" data-v="'+t[0]+'" class="'+(V.me===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div><div class="sp"></div>';
  return tabs+(V.me==='fav'?vFav():V.me==='wrong'?vWrong():V.me==='lib'?vLib():vSet());
}

/* ====== 渲染 ====== */
function render(){
  $('#app').innerHTML=V.tab==='home'?vHome():V.tab==='learn'?vLearn():V.tab==='voice'?vVoice():V.tab==='quiz'?vQuiz():vMe();
  renderNav();
}

/* ====== 事件 ====== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
  switch(a){
    case 'go':go(v,{me:b.dataset.me});break;
    case 'mego':go(v,{src:b.dataset.src});break;
    case 'home-review':{
      if(getPool('wrong').length)go('me',{me:'wrong'});
      else if(learnedCount())go('quiz',{src:'learned'});
      else toast('還沒有可複習的單字，先去學習幾個吧');
      break}
    case 'rate':S.set.rate=+v;save();render();break;
    case 'say':say(id,v);break;
    /* 學習 */
    case 'learn-src':S.ui.src=v;startLearn(v);render();break;
    case 'tgl-zh':S.ui.showZh=!S.ui.showZh;save();render();break;
    case 'tgl-tr':S.ui.showTr=!S.ui.showTr;save();render();break;
    case 'learned':{const i=Lr.ids[Lr.i];if(S.learned[i]){delete S.learned[i]}else{S.learned[i]=today();touchDay();toast('已標記為已學習')}save();render();break}
    case 'fav':{const i=Lr.ids[Lr.i];if(S.fav[i]){delete S.fav[i];toast('已取消收藏')}else{S.fav[i]=1;toast('已加入收藏')}save();render();break}
    case 'lprev':stopSpeech();setLi(Math.max(0,Lr.i-1));render();window.scrollTo(0,0);break;
    case 'lnext':stopSpeech();if(Lr.i>=Lr.ids.length-1){if(Lr.src==='today'){Lr.ids.forEach(i=>{if(!S.learned[i]){S.learned[i]=today()}});touchDay();save()}Lr.done=true}else setLi(Lr.i+1);render();window.scrollTo(0,0);break;
    case 'more-session':ensureSession(true);startLearn('today');render();window.scrollTo(0,0);break;
    case 'learn-restart':startLearn(Lr.src);render();break;
    case 'quiz-from-learn':S.ui.src=Lr.src;go('quiz');break;
    /* 語音 */
    case 'vtab':if(V.voice==='auto')apStop(true);V.voice=v;stopSpeech();render();break;
    case 'voice-src':apStop(true);S.ui.src=v;apPrepare();ltPrepare();shPrepare();save();render();break;
    case 'ap-start':apPrepare();AP.ids.length?apRun():toast('這個範圍沒有單字');break;
    case 'ap-resume':apRun();break;
    case 'ap-pause':apPause();break;
    case 'ap-stop':apStop();break;
    case 'ap-prev':apJump(-1);break;
    case 'ap-next':apJump(1);break;
    case 'ap-rep':apRepeat();break;
    case 'ap-loop':S.ui.loop=!S.ui.loop;save();render();break;
    case 'lt-mode':LT.mode=v;LT.showEn=false;LT.showZh=false;LT.played=0;render();break;
    case 'lt-play':ltPlay();break;
    case 'lt-en':LT.showEn=!LT.showEn;if(LT.mode==='sent')LT.showZh=LT.showEn;render();break;
    case 'lt-zh':LT.showZh=!LT.showZh;render();break;
    case 'lt-prev':ltMove(-1);break;
    case 'lt-next':ltMove(1);break;
    case 'sh-t':SH.target=v;SH.res=null;render();break;
    case 'sh-listen':{const w=byId(SH.ids[SH.i]);stopSpeech();speak(SH.target==='word'?w.w:w.e,'en');break}
    case 'sh-rec':shRec();break;
    case 'sh-prev':shMove(-1);break;
    case 'sh-next':shMove(1);break;
    /* 測驗 */
    case 'qtype':S.ui.qtype=v;save();render();break;
    case 'quiz-src':S.ui.src=v;save();render();break;
    case 'qn':S.ui.qn=+v;save();render();break;
    case 'qstart':startQuiz();break;
    case 'qans':qAnswer(+v);break;
    case 'qnext':qNext();break;
    case 'qagain':startQuiz();break;
    case 'qreset':Q=null;stopSpeech();render();break;
    /* 我的 */
    case 'metab':V.me=v;render();break;
    case 'detail':{const row=b.closest('.item');const o=row.classList.toggle('open');o?V.open.add(id):V.open.delete(id);break}
    case 'rfav':if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();render();break;
    case 'rlearn':if(S.learned[id])delete S.learned[id];else{S.learned[id]=today();touchDay()}save();render();break;
    case 'fam':{const w=S.wrong[id];if(w){w.fam=!w.fam;save();if(V.tab==='me')render();else{b.textContent=w.fam?'已標記為熟悉 ✓':'標記為已熟悉';b.disabled=true}}break}
    case 'lib-pos':V.lib.pos=v;V.lib.n=40;render();break;
    case 'lib-st':V.lib.st=v;V.lib.n=40;render();break;
    case 'lib-more':V.lib.n+=40;{const l=$('#libList');if(l)l.innerHTML=libListHTML()}break;
    case 'batch':S.set.batch=+v;ensureSession(true);if(Lr.src==='today')startLearn('today');save();render();toast('每次學習 '+v+' 個');break;
    case 'goal':S.set.goal=+v;save();render();break;
    case 'vtest-en':stopSpeech();TTS.ok?speak('Hello! This is a test of the English voice.','en'):toast('此瀏覽器不支援語音朗讀');break;
    case 'vtest-zh':stopSpeech();TTS.ok?speak('你好，這是中文語音測試。','zh'):toast('此瀏覽器不支援語音朗讀');break;
    case 'export':{
      try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='toeic-progress-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){toast('匯出失敗')}
      break}
    case 'reset':if(confirm('確定要清除全部學習紀錄嗎？（已學習、收藏、錯題、測驗紀錄都會刪除，無法復原）')){apStop(true);S=DEF();flush();Q=null;Lr.ids=[];V.open.clear();toast('已清除學習紀錄');go('home')}break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='libq'){V.lib.q=e.target.value;V.lib.n=40;const l=$('#libList');if(l)l.innerHTML=libListHTML()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='libu'){V.lib.unit=e.target.value;V.lib.n=40;const l=$('#libList');if(l)l.innerHTML=libListHTML()}
});

renderNav();render();
/* 測試用：暴露少數內部資訊 */
window.__app={D,S:()=>S,AP:()=>AP,V,TTS,go};
})();
</script>
</body>
</html>
